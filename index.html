<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aktobe 2000s · Ақтөбе</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #d8d4c6;
    font-family: "PT Sans", "Segoe UI", system-ui, Arial, sans-serif;
    color: #2b2724;
  }
  #view { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  .crosshair {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 0 1.5px rgba(43,39,36,.55);
    opacity: 0; transition: opacity .3s;
  }
  .crosshair.on { opacity: .85; }
  .crosshair.hidden { opacity: 0; }

  .prompt {
    position: absolute; left: 50%; bottom: 16%; transform: translate(-50%, 8px);
    padding: 8px 18px; border-radius: 6px;
    background: rgba(247,241,228,.9); border: 1.5px solid rgba(43,39,36,.4);
    box-shadow: 3px 3px 0 rgba(43,39,36,.18);
    font-size: 15px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .prompt.on { opacity: 1; transform: translate(-50%, 0); }

  .toast {
    position: absolute; left: 50%; top: 11%; transform: translate(-50%, -6px);
    padding: 7px 16px; border-radius: 6px; background: rgba(247,241,228,.88);
    border: 1.5px solid rgba(43,39,36,.3); font-size: 14px; font-weight: 700; white-space: nowrap;
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* a mid-2000s phone screen: grey-green LCD, dark pixels */
  .sms {
    position: absolute; right: 22px; top: 22px; width: 232px;
    padding: 9px 11px 11px; border-radius: 10px 10px 14px 14px;
    background: linear-gradient(180deg, #b9c7a3, #a9b893);
    border: 6px solid #2f3437; box-shadow: 0 0 0 2px #585f63, 5px 6px 0 rgba(0,0,0,.2);
    font-family: "PT Mono", Menlo, Consolas, monospace; color: #1f2a1c; font-size: 12.5px; line-height: 1.35;
    opacity: 0; transform: translateY(-10px); transition: opacity .3s, transform .3s;
  }
  .sms.on { opacity: 1; transform: none; }
  .sms-top { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .08em; margin-bottom: 4px; }
  .sms-from { font-weight: 700; border-bottom: 1px dashed rgba(31,42,28,.45); padding-bottom: 3px; margin-bottom: 4px; }

  .wallet {
    position: absolute; left: 20px; top: 18px; padding: 6px 12px; border-radius: 6px;
    background: rgba(247,241,228,.82); border: 1.5px solid rgba(43,39,36,.3);
    font-size: 15px; font-weight: 700; opacity: 0; transition: opacity .3s;
  }
  .wallet span { font-weight: 400; font-size: 12px; opacity: .7; margin-right: 4px; }
  .wallet.on { opacity: 1; }
  .wallet.spent { animation: spent .7s ease; }
  @keyframes spent { 0% { color: #b8423a; transform: scale(1.08); } 100% { color: inherit; transform: none; } }

  /* Lada-style round speedometer */
  .speedo {
    position: absolute; right: 26px; bottom: 26px; width: 170px; height: 170px;
    opacity: 0; transition: opacity .3s;
  }
  .speedo.on { opacity: 1; }
  .speedo-dial {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #1d2023 0 58%, #111315 70%);
    border: 5px solid #6f7478; box-shadow: 0 0 0 2px #2b2724, 4px 5px 0 rgba(0,0,0,.25);
  }
  .speedo-ticks .tick {
    position: absolute; left: 50%; top: 50%; width: 2px; height: 76px; margin-left: -1px;
    transform-origin: 50% 0; transform: rotate(calc(var(--a) + 180deg));
  }
  .speedo-ticks .tick::before { content: ''; position: absolute; bottom: 0; left: 0; width: 2px; height: 9px; background: #e9e1c9; }
  .speedo-ticks .tick i {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%) rotate(calc(-1 * (var(--a) + 180deg)));
    font-style: normal; font-size: 10px; color: #e9e1c9; font-family: "PT Sans Narrow", Arial Narrow, sans-serif;
  }
  .speedo-needle {
    position: absolute; left: 50%; top: 50%; width: 3px; height: 70px; margin-left: -1.5px; margin-top: -70px;
    background: #f06a2c; transform-origin: 50% 100%; border-radius: 2px; transition: transform .08s linear;
  }
  .speedo-hub { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #3b3f42; }
  .speedo-read { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; color: #e9e1c9; font-size: 11px; }
  .speedo-read b { font-size: 18px; }

  .hint {
    position: absolute; left: 18px; bottom: 14px; font-size: 13px; padding: 7px 13px; border-radius: 6px;
    background: rgba(247,241,228,.72); border: 1px solid rgba(43,39,36,.18); transition: opacity .8s;
  }
  .hint.faded { opacity: 0; }
  .coords {
    position: absolute; right: 16px; bottom: 14px; font-family: Menlo, Consolas, monospace; font-size: 12px;
    line-height: 1.5; text-align: right; padding: 8px 12px; border-radius: 6px;
    background: rgba(247,241,228,.8); border: 1px solid rgba(43,39,36,.18);
    opacity: 0; visibility: hidden; pointer-events: auto; cursor: copy;
  }
  .coords.on { opacity: 1; visibility: visible; }
  .coords i { opacity: .6; }
  .stats {
    position: absolute; left: 20px; top: 56px; font-family: Menlo, monospace; font-size: 11px;
    color: #2b2724; background: rgba(247,241,228,.7); padding: 3px 7px; border-radius: 4px; display: none;
  }
  .stats.on { display: block; }

  /* ---------- title / pause card ---------- */
  .overlay {
    position: absolute; inset: 0; pointer-events: auto; display: grid; place-items: center;
    background:
      radial-gradient(120% 90% at 20% 10%, rgba(255,236,200,.28), transparent 60%),
      linear-gradient(160deg, rgba(40,62,94,.62), rgba(120,96,70,.42) 55%, rgba(34,30,28,.58));
    backdrop-filter: blur(9px) saturate(.8);
    transition: opacity .45s, visibility .45s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .card {
    --ink: #2b2724; --paper: #f6efdf; --paper2: #efe5cf; --red: #b8342b; --sky: #1f8fb3; --gold: #e8b320; --pm: #2e3550;
    position: relative; display: grid; grid-template-columns: minmax(0, 1.18fr) minmax(360px, 1fr);
    width: min(1100px, calc(100vw - 48px)); min-height: min(600px, calc(100vh - 48px)); overflow: hidden;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .2  0 0 0 .07 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"),
      linear-gradient(180deg, var(--paper), var(--paper2));
    border-radius: 6px;
    box-shadow: 0 2px 0 rgba(255,255,255,.5) inset, 0 40px 90px -30px rgba(10,12,20,.75), 0 12px 30px -12px rgba(10,12,20,.45);
    animation: card-in .6s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes card-in { from { transform: translateY(14px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }

  /* the picture side of a 2007 postcard */
  .postcard { position: relative; padding: 22px; }
  .pc-photo {
    position: relative; height: 100%; min-height: 380px; overflow: hidden; border-radius: 3px;
    background: linear-gradient(180deg, #5e8fc4, #a8c6e2 60%, #d9ccb0);
    box-shadow: 0 0 0 7px #fbf7ee, 0 0 0 8px rgba(43,39,36,.18), 4px 6px 18px rgba(43,39,36,.28);
  }
  .pc-slides, .pc-slides img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .pc-slides img { object-fit: cover; opacity: 0; transform: scale(1.06); transition: opacity 1.6s ease, transform 8s linear; filter: saturate(1.06) contrast(1.02); }
  .pc-slides img.on { opacity: 1; transform: scale(1.0); }
  .pc-wait { position: absolute; inset: 0; display: grid; place-items: center; }
  .pc-wait span { font: italic 700 40px "PT Serif", Georgia, serif; color: rgba(255,255,255,.7); letter-spacing: .04em; }
  .pc-photo::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(130% 100% at 50% 40%, transparent 55%, rgba(40,30,20,.32)), linear-gradient(180deg, transparent 58%, rgba(20,16,12,.5));
  }
  .pc-caption {
    position: absolute; right: 14px; bottom: 14px; z-index: 2; padding: 3px 9px; border-radius: 2px;
    background: rgba(251,247,238,.86); color: var(--ink); font: 700 11px "PT Sans Narrow", "Arial Narrow", sans-serif;
    letter-spacing: .08em; text-transform: uppercase;
  }
  .pc-caption:empty { display: none; }
  .pc-greeting { position: absolute; left: 22px; bottom: 18px; z-index: 2; display: flex; flex-direction: column; transform: rotate(-4deg); transform-origin: left bottom; }
  .pc-big {
    font: italic 700 clamp(30px, 3.6vw, 46px)/1 "PT Serif", Georgia, "Times New Roman", serif; color: #fff8e6;
    -webkit-text-stroke: 1.2px #7a1f1a;
    text-shadow: 2px 2px 0 var(--red), 4px 4px 0 #7a1f1a, 6px 7px 12px rgba(0,0,0,.35);
  }
  .pc-small {
    margin: 8px 0 0 30px; font: italic 700 18px "PT Serif", Georgia, serif; color: #fff4d6;
    text-shadow: 1px 1px 0 #1f5f86, 2px 2px 0 rgba(0,0,0,.3);
  }
  /* a perforated stamp: holes cut by the mask round a solid middle */
  .pc-stamp {
    position: absolute; right: 40px; top: 38px; z-index: 3; width: 106px; height: 128px; padding: 7px;
    background: #fbf7ee; transform: rotate(4deg);
    -webkit-mask: radial-gradient(circle, transparent 3.1px, #000 3.6px) -5px -5px / 10px 10px round, linear-gradient(#000 0 0) 5px 5px / calc(100% - 10px) calc(100% - 10px) no-repeat;
    mask: radial-gradient(circle, transparent 3.1px, #000 3.6px) -5px -5px / 10px 10px round, linear-gradient(#000 0 0) 5px 5px / calc(100% - 10px) calc(100% - 10px) no-repeat;
    filter: drop-shadow(1px 2px 1px rgba(0,0,0,.25));
  }
  .pc-stamp-in { position: relative; height: 100%; border: 1.5px solid #1f5f86; background: #e9f1f3; overflow: hidden; }
  .pc-stamp-img { position: absolute; left: 4px; right: 4px; top: 16px; bottom: 18px; background: #9fc0d8 center / cover; filter: saturate(.8) sepia(.15); }
  .pc-stamp-in b { position: absolute; left: 0; right: 0; top: 3px; text-align: center; font: 700 10px "PT Sans Narrow", sans-serif; letter-spacing: .08em; color: #1f5f86; }
  .pc-stamp-in i { position: absolute; left: 5px; bottom: 2px; font: 700 11px "PT Sans", sans-serif; font-style: normal; color: var(--red); }
  .pc-stamp-in em { position: absolute; right: 5px; bottom: 3px; font: 700 9px "PT Sans", sans-serif; font-style: normal; color: #1f5f86; }
  .pc-postmark { position: absolute; right: 86px; top: 108px; z-index: 4; width: 200px; color: var(--pm); opacity: .62; transform: rotate(-9deg); mix-blend-mode: multiply; font-family: "PT Sans", Arial, sans-serif; }

  .card-copy { position: relative; padding: 40px 42px 26px 20px; display: flex; flex-direction: column; }
  .kicker { font-size: 11.5px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--red); }
  .card h1 { margin: 12px 0 0; font-family: Futura, "Century Gothic", "PT Sans", sans-serif; font-size: 56px; line-height: .95; letter-spacing: -.015em; color: var(--ink); }
  .card h1 span { color: var(--sky); }
  .lede { margin: 16px 0 18px; font-size: 15.5px; line-height: 1.55; max-width: 44ch; color: #3b3530; }
  .keys { list-style: none; margin: 0 0 18px; padding: 14px 0 0; border-top: 1px solid rgba(43,39,36,.16);
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 16px; font-size: 12.5px; color: #3b3530; }
  .keys li { display: flex; align-items: center; gap: 9px; min-width: 0; }
  .keys b { flex: none; min-width: 48px; padding: 3px 6px 2px; border-radius: 4px; text-align: center; font-size: 11px; letter-spacing: .02em;
    background: linear-gradient(180deg, #fffdf8, #ebe4d4); border: 1px solid rgba(43,39,36,.45); box-shadow: 0 2px 0 rgba(43,39,36,.35); color: var(--ink); }
  .keys span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .audio { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; margin-bottom: 16px; }
  .audio input { flex: 1; accent-color: var(--sky); }
  .card-actions { display: flex; align-items: center; gap: 16px; }
  .go { font: inherit; font-size: 18px; font-weight: 700; padding: 12px 28px; cursor: pointer; letter-spacing: .01em;
    border: 0; border-radius: 5px; background: linear-gradient(180deg, #f2c436, #dea419); color: var(--ink);
    box-shadow: 0 3px 0 #9c7010, 0 8px 18px -8px rgba(120,80,0,.7); transition: transform .1s, box-shadow .1s; }
  .go:hover { transform: translateY(-1px); box-shadow: 0 4px 0 #9c7010, 0 12px 22px -8px rgba(120,80,0,.7); }
  .go:active { transform: translateY(2px); box-shadow: 0 1px 0 #9c7010; }
  .go i { font-style: normal; margin-left: 6px; }
  .go-note { font-size: 12px; color: #7a6f64; }
  .foot { margin-top: auto; padding-top: 18px; display: flex; justify-content: space-between; font-size: 10.5px;
    letter-spacing: .14em; text-transform: uppercase; color: #8a7f72; }
  .overlay[data-mode="start"] .pause-only, .overlay[data-mode="paused"] .start-only { display: none; }
  @media (max-width: 860px) {
    .card { grid-template-columns: 1fr; overflow-y: auto; max-height: calc(100vh - 32px); }
    .postcard { padding: 16px 16px 0; } .pc-photo { min-height: 220px; height: 240px; }
    .card-copy { padding: 22px 24px; } .pc-postmark { width: 150px; }
  }

  .fatal { position: fixed; inset: 0; display: grid; place-items: center; background: #f5eedd; color: #2b2724;
    font-size: 16px; padding: 30px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
