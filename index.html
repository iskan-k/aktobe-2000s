<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aktobe 2000s · Ақтөбе</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #d8d4c6;
    font-family: "PT Sans", "Segoe UI", system-ui, Arial, sans-serif;
    color: #2b2724;
  }
  #view { display: block; width: 100vw; height: 100vh; }
  .hud { position: fixed; inset: 0; pointer-events: none; user-select: none; }

  .crosshair {
    position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%; background: rgba(255,255,255,.9); box-shadow: 0 0 0 1.5px rgba(43,39,36,.55);
    opacity: 0; transition: opacity .3s;
  }
  .crosshair.on { opacity: .85; }
  .crosshair.hidden { opacity: 0; }

  .prompt {
    position: absolute; left: 50%; bottom: 16%; transform: translate(-50%, 8px);
    padding: 8px 18px; border-radius: 6px;
    background: rgba(247,241,228,.9); border: 1.5px solid rgba(43,39,36,.4);
    box-shadow: 3px 3px 0 rgba(43,39,36,.18);
    font-size: 15px; font-weight: 700; letter-spacing: .01em; white-space: nowrap;
    opacity: 0; transition: opacity .15s, transform .15s;
  }
  .prompt.on { opacity: 1; transform: translate(-50%, 0); }

  .toast {
    position: absolute; left: 50%; top: 11%; transform: translate(-50%, -6px);
    padding: 7px 16px; border-radius: 6px; background: rgba(247,241,228,.88);
    border: 1.5px solid rgba(43,39,36,.3); font-size: 14px; font-weight: 700; white-space: nowrap;
    opacity: 0; transition: opacity .25s, transform .25s;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  /* a mid-2000s phone screen: grey-green LCD, dark pixels */
  .sms {
    position: absolute; right: 22px; top: 22px; width: 232px;
    padding: 9px 11px 11px; border-radius: 10px 10px 14px 14px;
    background: linear-gradient(180deg, #b9c7a3, #a9b893);
    border: 6px solid #2f3437; box-shadow: 0 0 0 2px #585f63, 5px 6px 0 rgba(0,0,0,.2);
    font-family: "PT Mono", Menlo, Consolas, monospace; color: #1f2a1c; font-size: 12.5px; line-height: 1.35;
    opacity: 0; transform: translateY(-10px); transition: opacity .3s, transform .3s;
  }
  .sms.on { opacity: 1; transform: none; }
  .sms-top { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: .08em; margin-bottom: 4px; }
  .sms-from { font-weight: 700; border-bottom: 1px dashed rgba(31,42,28,.45); padding-bottom: 3px; margin-bottom: 4px; }

  .wallet {
    position: absolute; left: 20px; top: 18px; padding: 6px 12px; border-radius: 6px;
    background: rgba(247,241,228,.82); border: 1.5px solid rgba(43,39,36,.3);
    font-size: 15px; font-weight: 700; opacity: 0; transition: opacity .3s;
  }
  .wallet span { font-weight: 400; font-size: 12px; opacity: .7; margin-right: 4px; }
  .wallet.on { opacity: 1; }
  .wallet.spent { animation: spent .7s ease; }
  @keyframes spent { 0% { color: #b8423a; transform: scale(1.08); } 100% { color: inherit; transform: none; } }

  /* Lada-style round speedometer */
  .speedo {
    position: absolute; right: 26px; bottom: 26px; width: 170px; height: 170px;
    opacity: 0; transition: opacity .3s;
  }
  .speedo.on { opacity: 1; }
  .speedo-dial {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 50% 45%, #1d2023 0 58%, #111315 70%);
    border: 5px solid #6f7478; box-shadow: 0 0 0 2px #2b2724, 4px 5px 0 rgba(0,0,0,.25);
  }
  .speedo-ticks .tick {
    position: absolute; left: 50%; top: 50%; width: 2px; height: 76px; margin-left: -1px;
    transform-origin: 50% 0; transform: rotate(calc(var(--a) + 180deg));
  }
  .speedo-ticks .tick::before { content: ''; position: absolute; bottom: 0; left: 0; width: 2px; height: 9px; background: #e9e1c9; }
  .speedo-ticks .tick i {
    position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%) rotate(calc(-1 * (var(--a) + 180deg)));
    font-style: normal; font-size: 10px; color: #e9e1c9; font-family: "PT Sans Narrow", Arial Narrow, sans-serif;
  }
  .speedo-needle {
    position: absolute; left: 50%; top: 50%; width: 3px; height: 70px; margin-left: -1.5px; margin-top: -70px;
    background: #f06a2c; transform-origin: 50% 100%; border-radius: 2px; transition: transform .08s linear;
  }
  .speedo-hub { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px; border-radius: 50%; background: #3b3f42; }
  .speedo-read { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; color: #e9e1c9; font-size: 11px; }
  .speedo-read b { font-size: 18px; }

  .hint {
    position: absolute; left: 18px; bottom: 14px; font-size: 13px; padding: 7px 13px; border-radius: 6px;
    background: rgba(247,241,228,.72); border: 1px solid rgba(43,39,36,.18); transition: opacity .8s;
  }
  .hint.faded { opacity: 0; }
  .coords {
    position: absolute; right: 16px; bottom: 14px; font-family: Menlo, Consolas, monospace; font-size: 12px;
    line-height: 1.5; text-align: right; padding: 8px 12px; border-radius: 6px;
    background: rgba(247,241,228,.8); border: 1px solid rgba(43,39,36,.18);
    opacity: 0; visibility: hidden; pointer-events: auto; cursor: copy;
  }
  .coords.on { opacity: 1; visibility: visible; }
  .coords i { opacity: .6; }
  .stats {
    position: absolute; left: 20px; top: 56px; font-family: Menlo, monospace; font-size: 11px;
    color: #2b2724; background: rgba(247,241,228,.7); padding: 3px 7px; border-radius: 4px; display: none;
  }
  .stats.on { display: block; }

  /* ---------- title / pause card ---------- */
  .overlay {
    position: absolute; inset: 0; pointer-events: auto; display: grid; place-items: center;
    background: linear-gradient(160deg, rgba(58,86,122,.45), rgba(214,170,110,.28) 60%, rgba(243,234,216,.35));
    backdrop-filter: blur(7px) saturate(.85);
    transition: opacity .45s, visibility .45s;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .card {
    --ink: #2b2724; --paper: #f5eedd; --red: #b8423a; --sky: #00afca; --gold: #e8b320;
    position: relative; display: grid; grid-template-columns: minmax(230px, .9fr) minmax(360px, 1.3fr);
    width: min(860px, calc(100vw - 40px)); min-height: 460px; overflow: hidden;
    background: var(--paper); border: 2px solid var(--ink); border-radius: 4px;
    box-shadow: 10px 12px 0 rgba(43,39,36,.25), 0 30px 70px -30px rgba(30,30,40,.7);
  }
  .card::after { content: ''; position: absolute; inset: 7px; border: 1px solid rgba(43,39,36,.18); pointer-events: none; }
  .card-art { position: relative; overflow: hidden; border-right: 2px solid var(--ink); }
  .art-sky { position: absolute; inset: 0; background: linear-gradient(180deg, #4f86c6 0%, #92b9df 55%, #e9dcc0 78%, #c9b58e 78.5%, #b8a27a 100%); }
  .art-sun { position: absolute; left: 14%; top: 30%; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle, #fff6dc 0 45%, rgba(255,236,190,.55) 60%, rgba(255,236,190,0) 72%); }
  .art-block { position: absolute; bottom: 22%; border: 2px solid var(--ink);
    background-color: #d9ccb4;
    background-image:
      repeating-linear-gradient(90deg, transparent 0 9px, rgba(43,39,36,.0) 9px 10px),
      repeating-linear-gradient(0deg, transparent 0 7px, rgba(90,84,74,.35) 7px 8px),
      repeating-linear-gradient(90deg, #d9ccb4 0 6px, #3a4a58 6px 13px, #d9ccb4 13px 17px);
  }
  .art-block.b1 { left: 8%; width: 44%; height: 30%; }
  .art-block.b2 { left: 56%; width: 34%; height: 46%; background-color: #bfbcb4; }
  .art-block.b3 { left: 30%; width: 22%; height: 18%; background-color: #d8b4a0; }
  .art-poplar { position: absolute; bottom: 21%; width: 22px; border-radius: 50% 50% 45% 45%;
    background: linear-gradient(90deg, #4f7236, #6e9244 60%, #88a656); border: 2px solid var(--ink); }
  .art-poplar.p1 { left: 4%; height: 40%; }
  .art-poplar.p2 { left: 50%; height: 48%; width: 26px; }
  .art-poplar.p3 { left: 86%; height: 36%; }
  .art-road { position: absolute; left: 0; right: 0; bottom: 0; height: 21%; background: #6a6b6e; border-top: 2px solid var(--ink); }
  .art-road::after { content: ''; position: absolute; left: 0; right: 0; top: 45%; height: 3px;
    background: repeating-linear-gradient(90deg, #e8e5da 0 22px, transparent 22px 40px); }
  .art-bus { position: absolute; left: 12%; bottom: 8%; width: 58%; height: 15%; border: 2px solid var(--ink);
    border-radius: 6px 10px 4px 4px; background: linear-gradient(180deg, #e8e2d2 0 52%, #c9473c 52% 70%, #e8e2d2 70%);
    display: flex; gap: 5%; padding: 5% 6% 0 4%; }
  .art-bus i { display: block; width: 16%; height: 36%; background: #3a4a58; border: 1.5px solid var(--ink); }
  .art-bus b { position: absolute; right: 4%; top: 12%; font-size: 12px; background: #fff; border: 1.5px solid var(--ink); padding: 0 3px; }
  .art-stamp { position: absolute; right: 8%; top: 7%; transform: rotate(8deg); padding: 4px 9px;
    border: 2px solid var(--red); color: var(--red); font-weight: 700; letter-spacing: .12em; font-size: 13px;
    background: rgba(245,238,221,.5); }
  .card-copy { position: relative; padding: 34px 38px 26px; display: flex; flex-direction: column; }
  .kicker { font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--red); }
  .card h1 { margin: 10px 0 0; font-family: Futura, "Century Gothic", "PT Sans", sans-serif; font-size: 50px; line-height: 1; letter-spacing: -.01em; }
  .card h1 span { color: var(--sky); -webkit-text-stroke: 1.5px var(--ink); }
  .lede { margin: 14px 0 16px; font-size: 15px; line-height: 1.5; max-width: 42ch; }
  .keys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px 14px; font-size: 12.5px; margin-bottom: 16px; }
  .keys b { display: inline-block; min-width: 46px; padding: 1px 5px; margin-right: 6px; border: 1.5px solid var(--ink);
    border-radius: 3px; background: #fff; font-size: 11.5px; text-align: center; }
  .audio { display: flex; align-items: center; gap: 12px; font-size: 13px; font-weight: 700; margin-bottom: 14px; }
  .audio input { flex: 1; accent-color: #00afca; }
  .go { align-self: flex-start; font: inherit; font-size: 17px; font-weight: 700; padding: 11px 24px; cursor: pointer;
    border: 2px solid var(--ink); border-radius: 4px; background: var(--gold); color: var(--ink);
    box-shadow: 4px 4px 0 var(--ink); transition: transform .1s, box-shadow .1s; }
  .go:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  .go i { font-style: normal; margin-left: 6px; }
  .foot { margin-top: auto; padding-top: 16px; display: flex; justify-content: space-between; font-size: 11px;
    letter-spacing: .1em; text-transform: uppercase; opacity: .6; }
  .overlay[data-mode="start"] .pause-only, .overlay[data-mode="paused"] .start-only { display: none; }
  @media (max-width: 720px) { .card { grid-template-columns: 1fr; } .card-art { height: 170px; border-right: 0; border-bottom: 2px solid var(--ink); } }

  .fatal { position: fixed; inset: 0; display: grid; place-items: center; background: #f5eedd; color: #2b2724;
    font-size: 16px; padding: 30px; text-align: center; line-height: 1.6; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
